# uitstalie 分支组合层（DH-1 / DH-5）：挂在 dsh-web-app 的 dsh.bundle.patch 列表末尾。
#
# 宿主侧：`.dsh` 基础接口（tool-dsh-store）、常驻上下文切面
# （agent-instructions-plus，原生 instruction loader 仍按自己的行运行）、角色卡
# （persona-card：能力默认关，`/persona use` 或 row 的 active 才注入）。
# 浏览器侧：models-dev 设置页、rules 按钮、common-view overlay。
- insert:
    - id: dafeiyu
      name: '@deepseek-ai/dsh-dafeiyu'
    - id: memory
      name: '@deepseek-ai/dsh-memory'
    - id: workspace-tools
      name: '@deepseek-ai/dsh-workspace-tools'
    - id: persona-card
      name: '@deepseek-ai/dsh-persona-card'
    - id: personality
      name: '@deepseek-ai/dsh-personality'
    - id: store-atom
      name: '@deepseek-ai/dsh-store-atom'
    - id: system-environment
      name: '@deepseek-ai/dsh-system-environment'
    - id: tool-dsh-store
      name: '@deepseek-ai/dsh-tool-dsh-store'
    - id: token-calculator
      name: '@deepseek-ai/dsh-token-calculator'
    - id: home-backup
      name: '@deepseek-ai/dsh-home-backup'
    - id: agent-instructions-plus
      name: '@deepseek-ai/dsh-agent-instructions-plus'
    - id: ui-models-dev
      name: '@deepseek-ai/dsh-client-ui-models-dev'
    - id: ui-tool-dsh-store
      name: '@deepseek-ai/dsh-client-ui-tool-dsh-store'
    - id: ui-dafeiyu
      name: '@deepseek-ai/dsh-client-ui-dafeiyu'
    - id: ui-memory
      name: '@deepseek-ai/dsh-client-ui-memory'
    - id: ui-common-view
      name: '@deepseek-ai/dsh-client-common-view'

# The web patch disables the profile-level native loader because the shipped presets
# used to mount it per agent; DH-5 moved every instruction row out of the presets and
# left this one disabled, so no baseline was produced at all. The plus seam decorates
# this profile-level baseline, so restore the row it wraps.
- id: agent-instructions
  disabled: false

- id: session-query-sqlite
  config:
    path: ':memory:'
    openAt: first-search
