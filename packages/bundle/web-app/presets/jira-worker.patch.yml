# Agent preset jira-worker: the composition a real executor Session joins (DH-703).
#
# It is deliberately its own preset id rather than `standard`. `superagent_worker_preset` names an
# id, and the jira capability treats every Session that joined it as an executor: the ledger reads
# plus `issue_work`, and none of the dispatcher verbs. Pointing that setting at a preset people also
# open conversations with would narrow those conversations too.
#
# The tooling below is the subset an executor needs to change a checkout and run its checks: a
# shell, the file tools, background jobs, and compaction. It carries no delegation, no goal, no
# planning and no `ask_user_question` — an executor reports through `issue_work` instead of asking.
#
# BEGIN uitstalie-deepseek-flash, 2026/11/02, DH-703, 真实 Session 执行者的专用组合
- insert:
    - id: preset-jira-worker
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: jira-worker
        order: 5
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: You are one executor working one claimed issue.
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
# END uitstalie-deepseek-flash
