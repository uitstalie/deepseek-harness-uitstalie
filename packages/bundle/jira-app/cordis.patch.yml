# The jira ledger over whatever profile this bundle is installed into.
#
# The service row opens the ledger, owns the push queue and answers `ctx.jira`; the agent row
# registers the capability (three tools, the awareness line, the write guard, `/jira`, the three
# skills and the turn-end settle) with dafeiyu. The browser row stays declared and disabled until
# `ui-jira` exports a client plugin: enabling a row whose package has no `apply` fails at load, and
# a row that silently does nothing is worse than one that is visibly off.

- insert:
    - id: jira-service
      name: '@deepseek-ai/dsh-jira-service'
      config:
        push:
          enabled: false

    - id: jira-agent
      name: '@deepseek-ai/dsh-jira-agent'

    # Pending: `packages/jira/ui-jira` owns the settings section id and order, not yet the plugin.
    - id: jira-ui
      name: '@deepseek-ai/dsh-client-ui-jira'
      disabled: true
